<style>
:root{--bg:#fff;--card:#f4f4f5;--ink:#1b1b1f;--mute:#85838a;--line:#e4e4e7;--acc:#3b6df0;--ai:#fff;--debt:#c8321f;--ok:#1f7a4d;--btn:#1b1b1f;--btnink:#fff;color-scheme:light}

*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}:root[data-m=light]{color-scheme:only light}
body{background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 16px}
.total{flex:1;min-width:0;background:var(--acc);color:var(--ai);border-radius:20px;padding:14px 18px;margin-right:12px;box-shadow:0 10px 26px -12px var(--acc)}.total small{color:inherit;opacity:.85;font-size:14px;display:block}
.total b{display:block;font-size:54px;font-weight:800;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}[hidden]{display:none!important}body,#set,table,td,input,button,.total{transition:background-color .25s,border-color .25s,color .25s,transform .12s}button:active{transform:scale(.95)}.hw{overflow:hidden}.gr{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line)}.gr span{background:var(--card);border-radius:999px;padding:4px 10px;color:var(--mute)}.gr b.pos{color:var(--debt)}.gr b.neg{color:var(--ok)}.hw.ex{animation:exp .35s ease}@keyframes exp{from{max-height:0;opacity:0}to{max-height:1500px;opacity:1}}.in,#set:not([hidden]),#ic:not([hidden]){animation:slide .22s ease}@keyframes slide{from{opacity:0;transform:translateY(-6px)}}button.wig{animation:wig .18s ease}@keyframes wig{30%{transform:rotate(-28deg) scale(1.25)}65%{transform:rotate(14deg) scale(1.1)}}#cpn{margin-top:10px}#cpn label{display:block;color:var(--mute);font-size:13px;margin:6px 0}#cpn input{width:100%;padding:0;border:0;background:none;height:28px;accent-color:var(--acc)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:48px;padding:0 18px;background:var(--acc,var(--btn));color:var(--ai,var(--btnink));cursor:pointer}
button.g{background:var(--card);background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--ink);border:1px solid var(--acc);font-weight:500}
button.d{background:none;color:var(--debt);border:1px solid var(--debt);font-weight:500}
.ic{width:48px;padding:0;font-size:22px}
input,textarea{font:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--acc,var(--ink))}
form{display:flex;gap:8px;margin-bottom:6px}form input{flex:1;padding:14px}
#q{width:100%;margin:6px 0 12px}
.hint{color:var(--mute);font-size:13px;margin:0 0 10px}.err{color:var(--debt);font-size:14px;min-height:20px;margin:0 0 4px}
#set{background:var(--card);border-radius:14px;padding:14px;margin-bottom:16px}
#set h4{margin:12px 0 8px;font-size:14px;color:var(--mute);font-weight:600}#set h4:first-child{margin-top:0}
.w{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:48px;min-height:48px;padding:0;border-radius:50%;border:3px solid transparent;background-clip:padding-box;flex:none}input.cp{width:48px;height:48px;padding:0;border:0;border-radius:50%;background:none;flex:none}input.cp::-webkit-color-swatch-wrapper{padding:0}input.cp::-webkit-color-swatch{border:0;border-radius:50%}button.g.on{background:var(--acc);color:var(--ai)}.sw.on{border-color:var(--ink)}
#bk{width:100%;height:70px;font-size:12px;margin:8px 0}

td{padding:14px;border-bottom:1px solid var(--line);font-size:18px;overflow-wrap:anywhere}tr:last-child>td{border-bottom:0}
tr.main{cursor:pointer}tr.king>td{background:rgba(245,184,0,.14);box-shadow:inset 0 2px 0 #f5b800,inset 0 -2px 0 #f5b800}tr.king>td:first-child{border-radius:14px 0 0 14px;box-shadow:inset 0 2px 0 #f5b800,inset 0 -2px 0 #f5b800,inset 2px 0 0 #f5b800}tr.king>td:last-child{border-radius:0 14px 14px 0;box-shadow:inset 0 2px 0 #f5b800,inset 0 -2px 0 #f5b800,inset -2px 0 0 #f5b800}td.s{width:40%;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
td.s small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.pos{color:var(--debt)}.neg{color:var(--ok)}.zero{color:var(--mute)}
tr.hist>td{padding:0;background:var(--bg)}
.h{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:15px;border-bottom:1px solid var(--line)}
.h .d{color:var(--mute);font-size:12px;width:52px;flex:none}.h .t{flex:1;min-width:0;overflow-wrap:anywhere}.h .t.no{color:var(--mute)}.h .a{font-weight:700;white-space:nowrap}
.h button{background:none;color:var(--mute);font-size:20px;font-weight:400;min-height:44px;min-width:44px;padding:0}
.h input{padding:8px;font-size:16px;min-width:0}.h .ea{width:72px;flex:none}.h .en{flex:1;width:0}.h button{min-width:40px}.h button[data-ed],.h button[data-sv]{color:var(--acc)}
.act{display:flex;gap:8px;flex-wrap:wrap;padding:12px}.act button{min-height:44px;font-size:15px}

.row{display:flex;justify-content:space-between}.row button{background:none;color:var(--acc);font-weight:600;font-size:15px}.row{align-items:center}button.yn{background:var(--debt);color:#fff}button.no{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}.h button.yn,.h button.no,.row button.yn,.row button.no{font-size:15px;min-height:44px;padding:0 16px;border-radius:12px}.h button.yn,.row button.yn{background:var(--debt);color:#fff;font-weight:700}.h button.no,.row button.no{background:var(--card);color:var(--ink);border:1px solid var(--line)}.act span{flex:1 1 100%}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("ru-RU");

const sums=()=>{const m={};data.log.forEach(l=>m[l.name]=(m[l.name]||0)+l.amt);return m};
const num=s=>parseFloat(String(s).replace(",","."));function grp(n){let L=data.log.filter(l=>l.name===n);const i=L.map(l=>l.note).lastIndexOf("Долг закрыт");if(i>=0)L=L.slice(i+1);const m=new Map();L.forEach(l=>{const r=(l.note||"").trim(),k=r.toLowerCase(),e=m.get(k)||{t:r||"без причины",s:0};e.s+=l.amt;m.set(k,e)});return[...m.values()].filter(e=>Math.abs(e.s)>.001)}

["#3b6df0","#1f9d6b","#e0457b","#8b5cf6","#f08a1c","#e5484d","#0ea5b7","#6b7280"].forEach(c=>{const b=document.createElement("button");b.className="sw";b.dataset.a=c;b.style.background=c;b.setAttribute("aria-label","Цвет");$("acc").appendChild(b)});const rb=document.createElement("button");rb.className="sw rb";rb.style.background="conic-gradient(#f33,#fc3,#3d6,#3cf,#63f,#f3c,#f33) border-box";rb.setAttribute("aria-label","Свой цвет");$("acc").appendChild(rb);const pn=document.createElement("div");pn.id="cpn";pn.hidden=true;pn.innerHTML='<label>Оттенок<input type="range" min="0" max="360" value="220"></label><label>Насыщенность<input type="range" min="20" max="100" value="80"></label><label>Яркость<input type="range" min="25" max="75" value="55"></label>';$("acc").after(pn);const hx=(h,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,"0")};return"#"+f(0)+f(8)+f(4)};pn.oninput=()=>{const v=[...pn.querySelectorAll("input")].map(i=>+i.value);data.set.a=hx(v[0],v[1],v[2]);save();applySet()};
function hist(n,closed,v){
  const items=data.log.filter(l=>l.name===n).slice().reverse();
  let h=items.map(l=>ask==="id"+l.id?`<div class="h in"><span class="t">Удалить запись?</span><button class="yn" data-y="1">Да</button><button class="no" data-no="1">Нет</button></div>`:l.id===editId?
   `<div class="h in"><input class="ea" inputmode="decimal" value="${l.amt}"><input class="en" value="${esc(l.note||"")}" placeholder="за что"><button data-sv="${l.id}">✓</button><button data-cx="1">×</button></div>`:
   `<div class="h"><span class="d">${dstr(l.ts)}</span><span class="t ${l.note?"":"no"}">${l.note?esc(l.note):"без пометки"}</span><span class="a ${l.amt>0?"pos":"neg"}">${l.amt>0?"+":""}${fmt(l.amt)}</span><button data-ed="${l.id}" aria-label="Правка">✎</button><button data-id="${l.id}" aria-label="Удалить запись">×</button></div>`).join("");
  const G=grp(n);if(G.length)h='<div class="gr">'+G.map(e=>'<span>'+esc(e.t)+' <b class="'+(e.s>0?"pos":"neg")+'">'+fmt(e.s)+'</b></span>').join("")+'</div>'+h;h+=ren===n?`<div class="act in"><input class="rn" value="${esc(n)}" style="flex:1"><button data-rok="1">✓</button><button class="no" data-no="1">×</button></div>`:ask==="dp:"+n?`<div class="act in"><span>Удалить ${esc(n)} со всей историей?</span><button class="yn" data-y="1">Да</button><button class="no" data-no="1">Нет</button></div>`:`<div class="act">${v>0?'<button data-rm="1">Напомнить</button>':""}<button class="g" data-rn="1">Переименовать</button>${closed?'<button class="g" data-re="1">Вернуть в список</button>':'<button class="g" data-cl="1">Долг закрыт</button>'}<button class="d" data-dp="1">Удалить</button></div>`;
  return h;
}
function rows(names,debts,top,closed){
  return names.map(n=>{const v=debts[n],o=open.has(n);
   return `<tr class="main${n===top?" king":""}" data-n="${esc(n)}"><td>${o?"▾":"▸"} ${n===top?"👑 ":""}${esc(n)}</td><td class="s ${v>0?"pos":v<0?"neg":"zero"}">${fmt(v)}<small>${v>0?"мне должны":v<0?"я должна":""}</small></td></tr>`+(o?`<tr class="hist" data-n="${esc(n)}"><td colspan="2"><div class="hw${n===jo?" ex":""}">${hist(n,closed,v)}</div></td></tr>`:"");
  }).join("")||'<tr><td class="zero">Пусто</td></tr>';
}
function render(){
  const d=sums(),all=Object.keys(d),act=all.filter(n=>!data.closed[n]).sort((a,b)=>d[b]-d[a]);
  const top=act.length&&d[act[0]]>0?act[0]:null;
  let pos=0,neg=0;act.forEach(n=>d[n]>0?pos+=d[n]:neg+=d[n]);
  tw(pos);$("mine").textContent=neg<0?"Я должна: "+fmt(-neg):"";

const find=n=>Object.keys(sums()).find(k=>k.toLowerCase()===n.toLowerCase())||n;

$("f").onsubmit=e=>{
  e.preventDefault();
  const t=$("in").value.trim().replace(/[−–—]/g,"-"),m=t.match(/^(.+?)\s*([+-]?\d+(?:[.,]\d+)?)(?:\s+(.*))?$/);

document.addEventListener("click",e=>{
  const T=e.target,g=a=>T.closest("["+a+"]"),tr=T.closest("tr[data-n]");

function doYes(){const a=ask;ask="";if(a.startsWith("id")){const id=+a.slice(2);data.log=data.log.filter(l=>l.id!==id)}else if(a.startsWith("dp:")){const n=a.slice(3);data.log=data.log.filter(l=>l.name!==n);delete data.closed[n];open.delete(n)}else if(a==="clear"){data={log:[],closed:{},set:data.set};open.clear()}else if(a==="imp"&&pend){data=pend;data.closed=data.closed||{};data.set=data.set||{m:"auto",a:""};norm();pend=null;applySet()}save();render()}
